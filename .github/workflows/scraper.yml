name: COA Address Scraper - Platform 3

on:
  # 1. Automatic background run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # 2. Manual trigger from GitHub Actions UI (Continuous by default)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional max records (Leave EMPTY for continuous non-stop run)'
        required: false
        default: ''
      delay:
        description: 'Polite delay between records in seconds'
        required: false
        default: '0.3'
      start_year:
        description: 'Filter start year (optional)'
        required: false
        default: ''
      end_year:
        description: 'Filter end year (optional)'
        required: false
        default: ''

concurrency:
  group: platform-3-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    name: Scrape Pending COA Records
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Up to ~6 hours continuous non-stop execution

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 mysql-connector-python python-dotenv ddddocr Pillow numpy

      - name: Run Sequential Continuous Scraper
        env:
          USE_REMOTE_API: "true"
          REMOTE_API_URL: ${{ secrets.REMOTE_API_URL }}
          REMOTE_API_KEY: ${{ secrets.REMOTE_API_KEY }}
          WORKER_ID: "github_action_platform3"
        run: |
          echo "=== Locating Scraper in Repository ==="
          SCRIPT_PATH=$(find . -iname "main.py" | head -n 1)

          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ Error: main.py not found in the repository!"
            echo "Repository contents:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          echo "✅ Found main.py at: $SCRIPT_PATH"
          SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
          cd "$SCRIPT_DIR"
          echo "Active directory: $(pwd)"

          # Base delay argument
          DELAY="${{ github.event.inputs.delay || '0.3' }}"
          ARGS="--delay $DELAY"

          # Only apply limit if a positive number was explicitly entered
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" -gt 0 ] 2>/dev/null; then
            echo "Running with limit: $LIMIT records"
            ARGS="$ARGS --limit $LIMIT"
          else
            echo "Running in CONTINUOUS MODE (One-by-one until queue is finished or timeout)"
          fi

          if [ -n "${{ github.event.inputs.start_year }}" ]; then
            ARGS="$ARGS --start-year ${{ github.event.inputs.start_year }}"
          fi

          if [ -n "${{ github.event.inputs.end_year }}" ]; then
            ARGS="$ARGS --end-year ${{ github.event.inputs.end_year }}"
          fi

          echo "Starting Scraper with: python main.py $ARGS"
          python main.py $ARGS
